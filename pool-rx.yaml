# Pool temperature LoRa receiver -> Home Assistant
# Board: Seeed XIAO ESP32S3 & Wio-SX1262 kit (868 MHz), USB powered, Wi-Fi + ESPHome API.
#
# Receives packets from pool-tx.yaml:
#   [0] 0x50 'P'   [1] sensor id   [2..3] temperature, int16 LE, 0.01 degC
#   [4..5] battery, uint16 LE, mV   [6] sequence number (optional, used to count lost packets)
#
# Link quality entities: RSSI, SNR, link margin (SNR above the SF9 demodulation limit),
# packets received / lost, packet loss, time since the last packet and an online indicator.
#
# LoRa settings MUST match pool-tx.yaml exactly.
#
# !!! Wio-SX1262 pin mapping: the kit exists in two mechanical versions.
#   - Board-to-board (B2B) connector between XIAO and Wio  -> use the "B2B" pins (default below)
#   - Wio plugged on the XIAO pin headers                   -> use the "header" pins (commented)
#   Check which one you received and adjust the substitutions.

substitutions:
  name: pool-lora-rx
  friendly_name: "LoRa RX"
  sensor_id: "0x01"
  # Mark the pool sensor offline when no packet arrived for this many seconds
  # (a bit more than two transmit intervals of pool-tx.yaml).
  offline_after_s: "1500"

  # --- B2B connector version (Meshtastic "seeed_xiao_s3" mapping) ---
  lora_sck: GPIO7
  lora_miso: GPIO8
  lora_mosi: GPIO9
  lora_nss: GPIO41
  lora_rst: GPIO42
  lora_dio1: GPIO39
  lora_busy: GPIO40
  lora_rxen: GPIO38
  # --- Pin-header version (Seeed pinout image: D0=DIO1 D1=BUSY D2=RST D3=NSS D4=RF_SW) ---
  # lora_sck: GPIO7    # D8
  # lora_miso: GPIO8   # D9
  # lora_mosi: GPIO9   # D10
  # lora_nss: GPIO4    # D3
  # lora_rst: GPIO3    # D2
  # lora_dio1: GPIO1   # D0
  # lora_busy: GPIO2   # D1
  # lora_rxen: GPIO5   # D4 (RF_SW)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - output.turn_on: lora_rx_enable

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret fallback_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # OTA uploads are encrypted with the API encryption key above (no separate password).
    encryption:
      # One-time migration: the receiver still runs firmware that asks for the old OTA
      # password, so this install goes up in plaintext with that password. Once it is
      # installed, remove allow_plaintext_upload and the password line below.
      allow_plaintext_upload: true
    password: !secret ota_password

web_server:
  port: 80
  version: 2
  include_internal: false
  ota: false   # no plaintext firmware upload page; updates go through encrypted OTA

globals:
  - id: last_seq
    type: int
    initial_value: "-1"
  - id: rx_count
    type: uint32_t
    initial_value: "0"
  - id: lost_count
    type: uint32_t
    initial_value: "0"
  - id: last_rx_ms
    type: uint32_t
    initial_value: "0"

spi:
  clk_pin: ${lora_sck}
  miso_pin: ${lora_miso}
  mosi_pin: ${lora_mosi}

output:
  # RF switch / RX enable on the Wio-SX1262 - keep high so the receive path is selected.
  - platform: gpio
    pin: ${lora_rxen}
    id: lora_rx_enable

sx126x:
  id: lora
  cs_pin: ${lora_nss}
  rst_pin: ${lora_rst}
  busy_pin: ${lora_busy}
  dio1_pin: ${lora_dio1}
  hw_version: sx1262
  rf_switch: true          # DIO2 drives the antenna switch
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  frequency: 868100000
  modulation: LORA
  bandwidth: 125_0kHz
  spreading_factor: 9
  coding_rate: CR_4_5
  preamble_size: 8
  sync_value: [0x14, 0x24] # private LoRa network
  crc_enable: true
  rx_start: true
  on_packet:
    then:
      - lambda: |-
          if ((x.size() != 6 && x.size() != 7) || x[0] != 0x50 || x[1] != ${sensor_id}) {
            ESP_LOGD("pool", "Ignored packet, %u bytes, RSSI %.0f dBm", (unsigned) x.size(), rssi);
            return;
          }
          int16_t c = (int16_t) (x[2] | (x[3] << 8));
          uint16_t mv = (uint16_t) (x[4] | (x[5] << 8));

          // Lost packets from the gap in the 8-bit sequence number. A jump backwards
          // or a gap of more than half the range means the transmitter restarted.
          if (x.size() == 7) {
            int seq = x[6];
            if (id(last_seq) >= 0) {
              int gap = (seq - id(last_seq) - 1 + 256) % 256;
              if (gap > 0 && gap < 128) id(lost_count) += gap;
            }
            id(last_seq) = seq;
          }
          id(rx_count)++;
          id(last_rx_ms) = millis();

          ESP_LOGI("pool", "Packet #%d: %.2f C, %.2f V, RSSI %.0f dBm, SNR %.1f dB",
                   id(last_seq), c / 100.0f, mv / 1000.0f, rssi, snr);
          id(pool_temp).publish_state(c / 100.0f);
          if (mv > 0) {
            id(pool_battery).publish_state(mv / 1000.0f);
            // Single LiPo cell, rested-voltage discharge curve (mV -> %), linear between
            // points. While the cell is charging the voltage reads high, so it shows 100 %.
            static const uint16_t curve[][2] = {
              {4200, 100}, {4150, 95}, {4110, 90}, {4080, 85}, {4020, 80}, {3980, 75},
              {3950, 70}, {3910, 65}, {3870, 60}, {3850, 55}, {3840, 50}, {3820, 45},
              {3800, 40}, {3790, 35}, {3770, 30}, {3750, 25}, {3730, 20}, {3710, 15},
              {3690, 10}, {3610, 5}, {3270, 0}};
            const size_t n = sizeof(curve) / sizeof(curve[0]);
            float pct = 0.0f;
            if (mv >= curve[0][0]) {
              pct = 100.0f;
            } else if (mv > curve[n - 1][0]) {
              for (size_t i = 1; i < n; i++) {
                if (mv >= curve[i][0]) {
                  float f = (float) (mv - curve[i][0]) / (curve[i - 1][0] - curve[i][0]);
                  pct = curve[i][1] + f * (curve[i - 1][1] - curve[i][1]);
                  break;
                }
              }
            }
            id(pool_battery_pct).publish_state(pct);
          }
          id(pool_rssi).publish_state(rssi);
          id(pool_snr).publish_state(snr);
          // SF9 demodulates down to about -12.5 dB SNR; the margin above that is
          // what is left before packets start to drop.
          id(pool_link_margin).publish_state(snr + 12.5f);
          id(pool_rx_count).publish_state(id(rx_count));
          id(pool_lost_count).publish_state(id(lost_count));
          uint32_t total = id(rx_count) + id(lost_count);
          id(pool_loss).publish_state(100.0f * id(lost_count) / total);
          // Wall-clock time of this packet as ISO 8601 text; Home Assistant shows it as a
          // live "x ago". Not a numeric sensor: a float holds a Unix time only to ~128 s.
          auto now = id(ha_time).utcnow();
          if (now.is_valid()) id(pool_last_rx).publish_state(now.strftime("%Y-%m-%dT%H:%M:%S+00:00"));

sensor:
  - platform: template
    id: pool_temp
    name: "Teplota v baz\u00E9ne"
    unit_of_measurement: "\u00B0C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    id: pool_battery
    name: "Bat\u00E9ria senzora"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2

  - platform: template
    id: pool_battery_pct
    name: "Batéria senzora %"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    id: pool_rssi
    name: "LoRa RSSI"
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic

  - platform: template
    id: pool_snr
    name: "LoRa SNR"
    unit_of_measurement: "dB"
    state_class: measurement
    entity_category: diagnostic

  - platform: template
    id: pool_link_margin
    name: "LoRa link margin"
    unit_of_measurement: "dB"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic

  - platform: template
    id: pool_rx_count
    name: "LoRa packets received"
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    id: pool_lost_count
    name: "LoRa packets lost"
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    id: pool_loss
    name: "LoRa packet loss"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic

  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic

time:
  - platform: homeassistant
    id: ha_time

text_sensor:
  - platform: template
    id: pool_last_rx
    name: "LoRa last packet"
    device_class: timestamp
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Senzor online"
    device_class: connectivity
    lambda: |-
      return id(last_rx_ms) != 0 && (millis() - id(last_rx_ms)) < ${offline_after_s} * 1000UL;
